[project]
name = "polymarket-kalshi-weather-bot"
version = "4.0.0"
description = "Simulation-only weather temperature prediction-market bot"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["venv", "frontend", "history_data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008"]  # FastAPI Depends() defaults are intentional

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
